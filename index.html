<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Klanglandschaft</title>

<!-- App-Einstellungen -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f0e9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Klanglandschaft">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<!-- Schrift -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">

<style>
/* =====================================================
   GRUNDWERTE
   Ein Strich (2px), eine Tinte, ein Papier.
   ===================================================== */

#klanglandschaft {
  --paper: #f2f0e9;
  --ink: #141414;
  --line: 2px;

  /* Abspiellinie: dünner, grau, leicht transparent */
  --path: #7a7a7a;
  --path-width: 2.5;
  --path-opacity: .75;

  --gap: 16px;
  --bar: 72px;
  --fundus: 120px;
}


html,
body {
  margin: 0 !important;
  padding: 0 !important;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #f2f0e9;
}


/* =====================================================
   GESAMTFLÄCHE
   ===================================================== */

#klanglandschaft {
  position: relative;

  width: 100vw;

  height: 100vh;
  height: 100dvh;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  background: var(--paper);
  color: var(--ink);

  font-family: "Atkinson Hyperlegible", "Trebuchet MS", sans-serif;
}


/* =====================================================
   FUNDUS
   Zeichnungen | Farbregler
   Papierkorb
   ===================================================== */

#soundpalette {
  position: absolute;

  left: var(--gap);
  top: var(--gap);
  bottom: calc(var(--bar) + 2 * var(--gap));

  width: var(--fundus);

  z-index: 900;

  display: grid;

  grid-template-columns: 1fr 40px;
  grid-template-rows: 1fr;

  box-sizing: border-box;

  border: var(--line) solid var(--ink);

  background: var(--paper);

  touch-action: none;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}


/* Zeichnungen: eine senkrechte Reihe, mittig */

#paletteIcons {
  grid-column: 1;
  grid-row: 1;

  min-height: 0;

  display: flex;
  flex-direction: column;

  justify-content: space-around;
  align-items: center;

  padding: 8px 0;

  box-sizing: border-box;
}


/* Farbregler mit "hoch" und "tief" */

#pitchColumn {
  grid-column: 2;
  grid-row: 1;

  min-height: 0;

  display: flex;
  flex-direction: column;

  align-items: center;

  gap: 8px;

  padding: 14px 10px 14px 0;
}


.pitchLabel {
  font-size: 11px;
  line-height: 1;
}


#pitchSlider {
  position: relative;

  flex: 1 1 auto;

  width: 14px;

  box-sizing: border-box;

  border: var(--line) solid var(--ink);

  background: linear-gradient(to bottom, #f15060, #0078bf);

  cursor: pointer;

  touch-action: none;

  outline: none;
}


#pitchThumb {
  position: absolute;

  left: -9px;
  width: 28px;

  top: calc((100 - var(--pv, 50)) * 1%);

  height: 14px;

  transform: translateY(-50%);

  box-sizing: border-box;

  border: var(--line) solid var(--ink);

  background: #7864a8;

  pointer-events: none;
}


#pitchSlider:focus-visible {
  outline: 2px solid rgba(0,0,0,.4);
  outline-offset: 4px;
}


/* Papierkorb – sitzt in der Werkzeugleiste */

#controls #trash {
  flex: 0 0 72px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-left: var(--line) solid var(--ink);

  transition: background .15s;
}


#trash svg {
  width: 26px;
  height: 26px;

  fill: none;

  stroke: var(--ink);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}


#trash.hover {
  background: var(--ink);
}


#trash.hover svg {
  stroke: var(--paper);
}


/* Tempo-Spalte: nur auf dem Handy (quer) sichtbar */

#tempoColumn {
  display: none;
}


/* =====================================================
   PARTITUR – leere Fläche
   ===================================================== */

#landscape {
  position: relative;

  margin-left: calc(var(--fundus) + 2 * var(--gap));
  margin-top: var(--gap);
  margin-right: var(--gap);

  flex: 1 1 auto;

  min-height: 0;

  overflow: hidden;

  background: var(--paper);

  touch-action: none;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}


/* =====================================================
   TITEL DES STÜCKS
   Anzeige klein oben rechts, Eingabe über das T-Werkzeug
   ===================================================== */

#titleDisplay {
  position: absolute;

  top: 8px;
  right: 12px;

  z-index: 800;

  max-width: 60%;

  overflow: hidden;

  white-space: nowrap;
  text-overflow: ellipsis;

  font-size: 15px;
  font-weight: 700;

  pointer-events: none;
}


#titleDialog {
  position: fixed;

  inset: 0;

  z-index: 1300;

  display: flex;

  justify-content: center;
  align-items: flex-start;

  padding-top: 10vh;

  background: rgba(242, 240, 233, .75);
}


#titleDialog[hidden] {
  display: none;
}


.titleBox {
  display: flex;

  align-items: center;

  gap: 10px;

  width: min(90vw, 460px);

  box-sizing: border-box;

  padding: 8px 8px 8px 16px;

  border: var(--line) solid var(--ink);
  border-radius: 14px;

  background: var(--paper);
}


#scoreTitle {
  flex: 1 1 auto;

  min-width: 0;

  margin: 0;
  padding: 6px 0;

  border: 0;
  border-bottom: 2px solid var(--ink);
  border-radius: 0;

  background: transparent;

  color: var(--ink);

  font: 700 17px/1.3 "Atkinson Hyperlegible", "Trebuchet MS", sans-serif;

  outline: none;
}


#scoreTitle::placeholder {
  color: rgba(20,20,20,.35);
  font-weight: 400;
}


#titleOk {
  flex: 0 0 44px;

  width: 44px;
  height: 44px;

  margin: 0;
  padding: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  border: 0;
  border-radius: 10px;

  background: var(--ink);

  cursor: pointer;
}


#titleOk svg {
  width: 24px;
  height: 24px;

  fill: none;

  stroke: var(--paper);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}


/* Ausgewähltes Zeichen: lässt sich verschieben und vergrößern */

#landscape .step.selected {
  outline: 2px dashed rgba(20, 20, 20, .45);
  outline-offset: 6px;
}


/* =====================================================
   HANDY HOCHKANT: Hinweis "quer halten"
   ===================================================== */

#rotateHint {
  display: none;
}


/* =====================================================
   FREIE ABSPIELLINIE
   Immer ÜBER den Klangzeichen.
   ===================================================== */

#pathLayer {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 700;

  overflow: visible;

  pointer-events: none;
}


#drawnPath {
  fill: none;

  stroke: var(--path);

  stroke-width: var(--path-width);

  stroke-linecap: round;
  stroke-linejoin: round;

  vector-effect: non-scaling-stroke;

  opacity: var(--path-opacity);
}


#pathHead {
  fill: var(--path);

  opacity: 0;

  vector-effect: non-scaling-stroke;

  pointer-events: none;
}


#landscape.drawing {
  cursor: crosshair;
}


/* =====================================================
   KLANGZEICHEN
   ===================================================== */

.step {
  position: absolute;

  display: block;

  transform: translate(-50%, -50%);

  transform-origin: center;

  scale: var(--sound-scale, 1);

  opacity: .22;

  cursor: grab;

  z-index: 10;

  touch-action: none;

  -webkit-tap-highlight-color: transparent;
}


.step.active {
  opacity: 1;
}


/* Wie Druckfarben: Überlagerungen mischen sich (Rot über Blau = Violett) */

#landscape .step {
  mix-blend-mode: multiply;
}


/* Kurzes Aufhellen, wenn ein Zeichen klingt */

#landscape .step.hit {
  animation: hit .35s ease-out;
}

@keyframes hit {
  0%   { filter: brightness(1.75); }
  100% { filter: brightness(1); }
}


.step.dragging {
  cursor: grabbing;

  z-index: 500;

  opacity: 1;

  filter: drop-shadow(0 5px 5px rgba(0,0,0,.25));
}


.palette-item {
  position: relative !important;

  left: auto !important;
  top: auto !important;

  flex: 0 0 auto;

  transform: none !important;

  scale: 1 !important;

  opacity: 1 !important;

  cursor: grab;
}


/* =====================================================
   WAAGERECHTER PLAYHEAD
   ===================================================== */

#playline {
  position: absolute;

  top: 0;
  bottom: 0;

  left: 0;

  width: 2px;

  background: var(--path);

  opacity: 0;

  pointer-events: none;

  z-index: 750;
}


/* =====================================================
   BEDIENLEISTE
   Eine durchgehende Leiste, Fächer teilen sich die Linien.
   ===================================================== */

#controls {
  position: relative;

  z-index: 1000;

  flex: 0 0 var(--bar);

  height: var(--bar);

  margin: var(--gap);

  display: flex;

  align-items: stretch;

  box-sizing: border-box;

  border: var(--line) solid var(--ink);

  background: var(--paper);
}


#controls button {
  flex: 0 0 72px;

  padding: 0 !important;
  margin: 0 !important;

  border: 0;
  border-left: var(--line) solid var(--ink);
  border-radius: 0;

  background: transparent;

  color: var(--ink);

  display: flex !important;

  align-items: center !important;
  justify-content: center !important;

  cursor: pointer;

  appearance: none;
  -webkit-appearance: none;

  -webkit-tap-highlight-color: transparent;
}


#controls button:first-child {
  border-left: 0;
}


/* versteckte Knöpfe (z. B. Vollbild auf iPhones) */

#controls button[hidden] {
  display: none !important;
}


/* Vollbild: Icon wechselt */

#fullscreen .iconExit {
  display: none;
}

#fullscreen.is-full .iconEnter {
  display: none;
}

#fullscreen.is-full .iconExit {
  display: block;
}


#controls button:disabled {
  cursor: default;
}


#controls button:disabled .icon {
  opacity: .25;
}


#controls .icon {
  width: 26px;
  height: 26px;

  fill: none;

  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}


/* Aktiv = umgekehrt */

#controls button.active {
  background: var(--ink);
  color: var(--paper);
}


/* =====================================================
   SPIELEN / STOPP – ein Knopf
   ===================================================== */

#play {
  flex-basis: 96px !important;

  background: var(--ink) !important;
  color: var(--paper) !important;
}


#play svg {
  width: 28px;
  height: 28px;

  fill: currentColor;
}


#play .iconStop {
  display: none;
}


#play.playing .iconPlay {
  display: none;
}


#play.playing .iconStop {
  display: block;
}


/* =====================================================
   TEMPO
   ===================================================== */

#tempoGroup {
  flex: 1 1 auto;

  min-width: 0;

  display: flex;

  align-items: center;

  gap: 16px;

  padding: 0 24px;

  border-left: var(--line) solid var(--ink);

  font-size: 13px;
}


.tempoLabel {
  flex: 0 0 auto;
}


#tempoValue {
  flex: 0 0 auto;

  min-width: 64px;

  text-align: right;

  font-weight: 700;

  font-variant-numeric: tabular-nums;
}


/* Schieberegler: Linie + eckiger Griff */

#tempo {
  flex: 1 1 auto;

  min-width: 40px;

  height: 28px;

  margin: 0;

  background: transparent;

  appearance: none;
  -webkit-appearance: none;

  cursor: pointer;
}


#tempo::-webkit-slider-runnable-track {
  height: 2px;

  background: var(--ink);
}


#tempo::-webkit-slider-thumb {
  -webkit-appearance: none;

  width: 16px;
  height: 28px;

  margin-top: -13px;

  box-sizing: border-box;

  border: 2px solid var(--ink);
  border-radius: 0;

  background: var(--paper);
}


#tempo::-moz-range-track {
  height: 2px;

  background: var(--ink);
}


#tempo::-moz-range-thumb {
  width: 16px;
  height: 28px;

  box-sizing: border-box;

  border: 2px solid var(--ink);
  border-radius: 0;

  background: var(--paper);
}


/* =====================================================
   AUFNAHME (nur Seite mit Mikrofon-Knopf)
   ===================================================== */

/* Aufnahme-Modus: Zeichen im Fundus rot gestrichelt umrandet */

#klanglandschaft.record-mode .palette-item {
  outline: 2px dashed #e4572e;
  outline-offset: 6px;

  cursor: pointer;
}


/* Während der Aufnahme: kräftiger, pulsierender Rahmen */

#klanglandschaft .palette-item.recording {
  outline: 3px solid #e4572e;
  outline-offset: 6px;

  animation: recPulse .7s ease-in-out infinite alternate;
}


@keyframes recPulse {
  from { outline-color: #e4572e; }
  to   { outline-color: rgba(228, 87, 46, .25); }
}


/* =====================================================
   MELDUNG
   ===================================================== */

#scoreMessage {
  position: absolute;

  left: 50%;
  bottom: calc(var(--bar) + 2 * var(--gap) + 12px);

  transform: translateX(-50%);

  z-index: 1100;

  padding: 8px 14px;

  background: var(--ink);

  color: var(--paper);

  font-size: 13px;

  white-space: nowrap;

  opacity: 0;

  pointer-events: none;

  transition: opacity .25s;
}


#scoreMessage.visible {
  opacity: 1;
}


/* =====================================================
   BILD AUF DIE PARTITUR ZIEHEN
   ===================================================== */

#klanglandschaft.dropping #landscape {
  outline: 3px dashed rgba(0,0,0,.35);
  outline-offset: -10px;
}


/* =====================================================
   TABLET HOCHKANT / SMARTPHONE
   ===================================================== */

@media (max-width: 760px) {

  #klanglandschaft {
    --gap: 8px;
    --bar: 56px;
    --fundus: 92px;
  }

  #soundpalette {
    grid-template-columns: 1fr 32px;
    grid-template-rows: 1fr;
  }

  #pitchColumn {
    padding: 12px 8px 12px 0;
  }

  #controls button,
  #controls #trash {
    flex-basis: 52px;
  }

  #play {
    flex-basis: 64px !important;
  }

  #tempoGroup {
    gap: 10px;
    padding: 0 12px;
  }

  .tempoLabel {
    display: none;
  }

  #tempoValue {
    min-width: 0;
    font-size: 12px;
  }

  #scoreMessage {
    white-space: normal;
    width: max-content;
    max-width: 80vw;
    text-align: center;
  }

}


@media (max-width: 420px) {

  #controls button,
  #controls #trash {
    flex-basis: 44px;
  }

  #play {
    flex-basis: 52px !important;
  }

  #tempoValue {
    display: none;
  }

}


/* =====================================================
   HANDY QUER
   ganz links: Tempo | Farbe | Zeichnungen
   Mitte: Partitur
   rechts: Werkzeugleiste
   Alle Kästen mit runden Ecken, passend zum Bildschirm.
   ===================================================== */

@media (orientation: landscape) and (max-height: 500px) {

  #klanglandschaft {
    --gap: 8px;
    --radius: 16px;
    --side: 56px;
    --slider-col: 36px;
    --icons-col: 104px;
    --fundus: calc(2 * var(--slider-col) + var(--icons-col) + 12px);

    flex-direction: row;
  }


  /* ---------- Linke Seite: drei runde Kästen ---------- */

  #soundpalette {
    bottom: var(--gap);

    display: grid;

    grid-template-columns: var(--slider-col) var(--slider-col) 1fr;
    grid-template-rows: 1fr;

    gap: 6px;

    border: 0;

    background: transparent;
  }


  #tempoColumn,
  #pitchColumn {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 6px;

    padding: 10px 0;

    box-sizing: border-box;

    border: var(--line) solid var(--ink);
    border-radius: var(--radius);

    background: var(--paper);

    min-height: 0;
  }


  #tempoColumn {
    grid-column: 1;
    grid-row: 1;
  }


  #pitchColumn {
    grid-column: 2;
    grid-row: 1;
  }


  #paletteIcons {
    grid-column: 3;
    grid-row: 1;

    display: grid;

    grid-template-columns: repeat(2, minmax(0, 1fr));

    align-content: space-evenly;
    justify-items: center;

    padding: 4px;

    border: var(--line) solid var(--ink);
    border-radius: var(--radius);

    background: var(--paper);
  }


  .pitchLabel,
  .sideLabel {
    font-size: 9px;
    line-height: 1;
  }


  .sideValue {
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }


  /* Schieber: schmale runde Bahn, runder Griff */

  #pitchSlider,
  #tempoSliderV {
    position: relative;

    flex: 1 1 auto;

    width: 12px;

    box-sizing: border-box;

    border: var(--line) solid var(--ink);
    border-radius: 8px;

    cursor: pointer;

    touch-action: none;
  }


  #pitchSlider {
    background: linear-gradient(to bottom, #f15060, #0078bf);
  }


  #tempoSliderV {
    background: var(--paper);
  }


  #pitchThumb,
  #tempoThumb {
    position: absolute;

    left: -8px;
    width: 24px;
    height: 12px;

    transform: translateY(-50%);

    box-sizing: border-box;

    border: var(--line) solid var(--ink);
    border-radius: 6px;

    pointer-events: none;
  }


  #pitchThumb {
    top: calc((100 - var(--pv, 50)) * 1%);
  }


  #tempoThumb {
    top: calc(var(--tv, 64) * 1%);

    background: var(--ink);
  }


  /* ---------- Partitur ---------- */

  #landscape {
    margin: var(--gap) 0 var(--gap) calc(var(--fundus) + 2 * var(--gap));
  }

  #titleDisplay {
    top: 4px;
    right: 8px;

    font-size: 12px;
  }


  /* ---------- Werkzeugleiste rechts ---------- */

  #controls {
    flex: 0 0 var(--side);

    width: var(--side);
    height: auto;

    margin: var(--gap);

    flex-direction: column;

    border-radius: var(--radius);

    overflow: hidden;
  }

  #controls button,
  #controls #trash {
    flex: 1 1 44px;

    min-height: 30px;

    border-left: 0;
    border-top: var(--line) solid var(--ink);
  }

  #controls > :first-child {
    border-top: 0;
  }

  #play {
    flex: 1.3 1 50px !important;
  }

  #controls .icon,
  #trash svg {
    width: 21px;
    height: 21px;
  }

  #play svg {
    width: 23px;
    height: 23px;
  }

  /* Tempo sitzt links als Schieber */

  #tempoGroup {
    display: none !important;
  }


  /* ---------- Meldung ---------- */

  #scoreMessage {
    bottom: calc(var(--gap) + 12px);
  }

  #titleDialog {
    padding-top: 12px;
  }

}


/* =====================================================
   HANDY HOCHKANT
   Zum Komponieren zu schmal: freundlicher Hinweis.
   ===================================================== */

@media (orientation: portrait) and (max-width: 600px) {

  #soundpalette,
  #landscape,
  #controls {
    display: none !important;
  }

  #rotateHint {
    position: absolute;
    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 24px;

    padding: 40px;

    text-align: center;
  }

  #rotateHint svg {
    width: 110px;
    height: 110px;

    fill: none;

    stroke: var(--ink);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #rotateHint p {
    margin: 0;

    font-size: 22px;
    font-weight: 700;
  }

}

</style>
</head>
<body>

<div id="klanglandschaft">

  <div id="soundpalette">

    <div id="tempoColumn">

      <span id="tempoNumber" class="sideLabel sideValue">90</span>

      <div id="tempoSliderV" role="slider" tabindex="0"
           aria-label="Tempo" aria-valuemin="50" aria-valuemax="160" aria-valuenow="90"
           title="Tempo: oben schnell, unten langsam">
        <div id="tempoThumb"></div>
      </div>

      <span class="sideLabel">BPM</span>

    </div>

    <div id="paletteIcons"></div>

    <div id="pitchColumn">

      <span class="pitchLabel">hoch</span>

      <div id="pitchSlider" role="slider" tabindex="0"
           aria-label="Farbe und Tonhöhe" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"
           title="Farbe & Tonhöhe (Doppeltippen = Mitte)">
        <div id="pitchThumb"></div>
      </div>

      <span class="pitchLabel">tief</span>

    </div>

  </div>


  <div id="landscape">

    <div id="titleDisplay" aria-live="polite"></div>

    <svg id="pathLayer" viewBox="0 0 1000 1000" preserveAspectRatio="none">

      <polyline id="drawnPath"></polyline>

      <circle id="pathHead" cx="0" cy="0" r="6"></circle>

    </svg>

    <div id="playline"></div>

  </div>


  <div id="controls">

    <button class="controlButton" id="play" title="Spielen / Stopp" aria-label="Spielen">
      <svg class="iconPlay" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 4.5l13 7.5-13 7.5z"></path>
      </svg>
      <svg class="iconStop" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12"></rect>
      </svg>
    </button>

    <button class="controlButton" id="drawPath" title="Abspiellinie zeichnen" aria-label="Abspiellinie zeichnen">

<script>
document.addEventListener("DOMContentLoaded", function () {


/* =========================================================
   KONFIGURATION – GRUPPEN

   Jede Gruppe hat eine eigene Liste von Klangzeichen.
   Welche Gruppe geladen wird, steht in der Adresse:

     klanggeraeusche.cargo.site/?gruppe=a
     klanggeraeusche.cargo.site/?gruppe=b

   Ohne Angabe wird die ERSTE Gruppe geladen.

   Gruppennamen: nur Kleinbuchstaben, Zahlen, - und _
   (keine Leerzeichen, keine Umlaute).

   Jede Zeile = ein Klangzeichen:
   bild  = Zeichnung (PNG oder JPG, heller oder
           transparenter Hintergrund)
   klang = Sounddatei (mp3)
   ersatz = (freiwillig) zweite Adresse, falls "klang"
            nicht gefunden wird

   Beliebig viele Zeilen möglich.
   Leere Bild-Adresse "" = Platzhalter mit Nummer.

   Neue Gruppe anlegen: den Block von "standard"
   kopieren, umbenennen (z. B. "a") und die Adressen
   austauschen. Komma zwischen den Gruppen nicht vergessen.
   ========================================================= */

const GRUPPEN = {

  "standard": [

    { // 1
      bild:  "grafiken/01-spirale.png",
      klang: "klaenge/21kb808-bd01.wav.mp3",
      ersatz: "https://freight.cargo.site/m/K3142575085704848764014052702319/21kb808-bd01.wav.mp3"
    },

    { // 2
      bild:  "grafiken/02-knaeuel.png",
      klang: "klaenge/24kb808-hh03.wav.mp3",
      ersatz: "https://freight.cargo.site/m/N3142575085833975972530019563631/24kb808-hh03.wav.mp3"
    },

    { // 3
      bild:  "grafiken/03-punktfeld.png",
      klang: "klaenge/34kb808-sd02.wav.mp3",
      ersatz: "https://freight.cargo.site/m/A3142575085963103181045986424943/34kb808-sd02.wav.mp3"
    },

    { // 4
      bild:  "grafiken/04-zickzack.png",
      klang: "klaenge/44kb808-tme3.wav.mp3",
      ersatz: "https://freight.cargo.site/m/W3142575085981549925119695976559/44kb808-tme3.wav.mp3"
    },

    { // 5
      bild:  "grafiken/05-welle.png",
      klang: "klaenge/45kb808-cme1.wav.mp3",
      ersatz: "https://freight.cargo.site/m/G3142575085999996669193405528175/45kb808-cme1.wav.mp3"
    },

    { // 6
      bild:  "grafiken/06-schraffur.png",
      klang: "klaenge/54kb808-thi3.wav.mp3",
      ersatz: "https://freight.cargo.site/m/B3142575086036890157340824631407/54kb808-thi3.wav.mp3"
    },

    { // 7
      bild:  "grafiken/07-ringe.png",
      klang: "klaenge/67kb808-clap4.wav.mp3",
      ersatz: "https://freight.cargo.site/m/O3142575086073783645488243734639/67kb808-clap4.wav.mp3"
    },

    { // 8
      bild:  "grafiken/08-strahlen.png",
      klang: "klaenge/367kb808-cym05.wav.mp3",
      ersatz: "https://freight.cargo.site/m/Q3142575086110677133635662837871/367kb808-cym05.wav.mp3"
    }

  ],


  /* BEISPIEL – zum Benutzen die Kommentarzeichen
     davor und dahinter entfernen:

  "a": [

    { // 1
      bild:  "https://freight.cargo.site/.../zeichnung1.png",
      klang: "https://freight.cargo.site/.../klang1.mp3"
    },

    { // 2
      bild:  "https://freight.cargo.site/.../zeichnung2.png",
      klang: "https://freight.cargo.site/.../klang2.mp3"
    }

  ],

  */

};


/* Gruppe aus der Adresse lesen */

const GRUPPE = (function () {

  let key = "";

  try {
    key = new URLSearchParams(location.search).get("gruppe") || "";
  }
  catch (e) {}

  if (!key) {
    const m = location.hash.match(/gruppe=([\w-]+)/);
    key = m ? m[1] : "";
  }

  key = key.toLowerCase();

  return GRUPPEN[key] ? key : Object.keys(GRUPPEN)[0];

})();

const SOUNDS = GRUPPEN[GRUPPE];


/* ---------- Farbe & Tonhöhe ---------- */

/* Der Farbregler neben dem Fundus mischt zwischen
   Rot (oben) und Blau (unten). Jedes neue Zeichen
   bekommt die gerade eingestellte Farbe – und damit
   seine Tonhöhe:
   Rot = höher, Blau = tiefer, Mitte = Originalhöhe.
   false = Regler ausblenden, Zeichen bleiben schwarz. */

const PITCH_ON = true;

/* Spannweite in Halbtönen nach oben und nach unten.
   12 = eine Oktave. */

const PITCH_SEMITONES = 12;

/* Farben wie Risograph-Druckfarben: überlagern sich
   auf der Fläche wie Druckfarben (Rot über Blau = Violett). */

const COLOR_HIGH = [241, 80, 96];    // Rot  (hoch)
const COLOR_LOW  = [0, 120, 191];    // Blau (tief)
const COLOR_OFF  = [17, 17, 17];     // ohne Farbregler


/* ---------- Raster & Bedienung ---------- */

const ROWS = SOUNDS.length;

const GRID_STEPS = 16;
const SUBDIVISIONS = 8;
const TICKS = GRID_STEPS * SUBDIVISIONS;

const SYMBOL_SIZE = 46;        // längste Seite eines Zeichens in px
const MASK_SIZE = 256;         // interne Auflösung der Zeichnungen

const HOLD_TIME = 380;
const PAINT_DISTANCE = 22;
const PALETTE_DRAG_DISTANCE = 10;

const MIN_SCALE = 0.30;
const MAX_SCALE = 5.00;

const PATH_SAMPLE_DISTANCE = 3;
const SIMPLIFY_TOLERANCE = 5;

const LOOKAHEAD = 0.12;        // Sekunden im Voraus planen
const SCHEDULE_INTERVAL = 25;  // ms


/* =========================================================
   DOM
   ========================================================= */

const app = document.getElementById("klanglandschaft");
const landscape = document.getElementById("landscape");
const palette = document.getElementById("soundpalette");
const paletteIcons = document.getElementById("paletteIcons");
const pitchSlider = document.getElementById("pitchSlider");
const pitchThumb = document.getElementById("pitchThumb");
const trash = document.getElementById("trash");
const playline = document.getElementById("playline");

const playButton = document.getElementById("play");
const stopButton = document.getElementById("stop");
const drawButton = document.getElementById("drawPath");
const resetButton = document.getElementById("resetScore");
const undoButton = document.getElementById("undo");
const saveImageButton = document.getElementById("saveImage");
const openImageButton = document.getElementById("openImage");
const imageInput = document.getElementById("imageInput");
const micButton = document.getElementById("mic");
const scoreTitle = document.getElementById("scoreTitle");
const tempoGroup = document.getElementById("tempoGroup");
const fullscreenButton = document.getElementById("fullscreen");
const tempoSliderV = document.getElementById("tempoSliderV");
const tempoNumber = document.getElementById("tempoNumber");
const titleButton = document.getElementById("titleButton");
const titleDialog = document.getElementById("titleDialog");
const titleOk = document.getElementById("titleOk");
const titleDisplay = document.getElementById("titleDisplay");

/* Aufnahme nur auf Seiten, deren HTML den Mikrofon-Knopf hat */
const RECORDING_ENABLED = !!micButton;

const tempoSlider = document.getElementById("tempo");
const tempoValue = document.getElementById("tempoValue");

const drawnPath = document.getElementById("drawnPath");
const pathHead = document.getElementById("pathHead");

const scoreMessage = document.getElementById("scoreMessage");


if (!landscape || !palette || !paletteIcons) {
  return;
}


/* =========================================================
   MELDUNG
   ========================================================= */

let messageTimer = null;

function showMessage(text) {

  if (!scoreMessage) {
    return;
  }

  scoreMessage.textContent = text;
  scoreMessage.classList.add("visible");

  clearTimeout(messageTimer);

  messageTimer = setTimeout(function () {
    scoreMessage.classList.remove("visible");
  }, 3000);

}


/* =========================================================
   AUDIO
   ========================================================= */

const AC = window.AudioContext || window.webkitAudioContext;

const audioContext = new AC();

const buffers = new Array(ROWS).fill(null);

const masterGain = audioContext.createGain();


/* Begrenzer: Wenn viele Klänge gleichzeitig spielen,
   wird es nicht verzerrt, sondern nur sanft gebremst. */

const limiter = audioContext.createDynamicsCompressor();

limiter.threshold.value = -6;
limiter.knee.value = 6;
limiter.ratio.value = 12;
limiter.attack.value = 0.003;
limiter.release.value = 0.25;

masterGain.connect(limiter);
limiter.connect(audioContext.destination);


const recordedRows = new Set();   // Zeichen mit eigener Aufnahme

async function loadSound(url, row) {

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("nicht gefunden");
    }

    const data = await response.arrayBuffer();
    const decoded = await audioContext.decodeAudioData(data);

    if (!recordedRows.has(row)) {
      buffers[row] = decoded;
    }
  }

  catch (error) {

    /* Ersatz-Adresse probieren (z. B. Cargo), falls angegeben */

    const ersatz = SOUNDS[row] && SOUNDS[row].ersatz;

    if (ersatz && ersatz !== url) {
      loadSound(ersatz, row);
      return;
    }

    console.error("Sound konnte nicht geladen werden:", url, error);
  }

}

SOUNDS.forEach(function (entry, row) {
  if (entry.klang) {
    loadSound(entry.klang, row);
  }
});


/* when = Zeitpunkt auf der Audio-Uhr (0 = sofort) */

function playSound(row, volume, rate, when) {

  if (!buffers[row]) {
    return false;
  }

  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();

  source.buffer = buffers[row];
  source.playbackRate.value = rate || 1;

  gain.gain.value = volume === undefined ? 0.35 : volume;

  source.connect(gain);
  gain.connect(masterGain);

  source.start(when || 0);

  return true;

}


async function resumeAudio() {

  if (audioContext.state === "suspended") {
    try { await audioContext.resume(); } catch (e) {}
  }

}


/* =========================================================
   FARBREGLER → TONHÖHE & FARBE

   Wert 0–100:  100 = Rot/hoch,  50 = Mitte,  0 = Blau/tief
   ========================================================= */

let currentPitch = 50;


function rateFromPitch(value) {

  if (!PITCH_ON) {
    return 1;
  }

  const v = Math.max(-1, Math.min(1, (value - 50) / 50));

  return Math.pow(2, v * PITCH_SEMITONES / 12);

}


function mix(a, b, t) {
  return [
    Math.round(a[0] + (b[0] - a[0]) * t),
    Math.round(a[1] + (b[1] - a[1]) * t),
    Math.round(a[2] + (b[2] - a[2]) * t)
  ];
}


function colorFromPitch(value) {

  if (!PITCH_ON) {
    return "rgb(" + COLOR_OFF.join(",") + ")";
  }

  const t = Math.max(0, Math.min(1, value / 100));

  return "rgb(" + mix(COLOR_LOW, COLOR_HIGH, t).join(",") + ")";

}


/* =========================================================
   GRÖSSE → LAUTSTÄRKE
   ========================================================= */

function scaleToVolume(scale) {

  let normalized = (scale - MIN_SCALE) / (MAX_SCALE - MIN_SCALE);

  normalized = Math.max(0, Math.min(1, normalized));

  return 0.02 + Math.pow(normalized, 1.7) * 1.48;

}


function setScale(cell, scale) {

  if (!cell) {
    return;
  }

  scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));

  cell.dataset.scale = scale;
  cell.dataset.volume = scaleToVolume(scale);

  cell.style.setProperty("--sound-scale", scale);

}


/* =========================================================
   ZEICHNUNGEN LADEN

   Jede Zeichnung wird in eine "Maske" umgewandelt:
   dunkle Striche bleiben, heller Hintergrund verschwindet.
   So funktionieren auch JPGs und abfotografierte Blätter.
   Die Maske wird dann je nach Höhe eingefärbt.
   ========================================================= */

const masks = new Array(ROWS).fill(null);


/* Platzhalter: Kreis mit Nummer */

function makeFallbackMask(row) {

  const canvas = document.createElement("canvas");

  canvas.width = 128;
  canvas.height = 128;

  const ctx = canvas.getContext("2d");

  ctx.strokeStyle = "#000";
  ctx.fillStyle = "#000";
  ctx.lineWidth = 9;

  ctx.beginPath();
  ctx.arc(64, 64, 54, 0, Math.PI * 2);
  ctx.stroke();

  ctx.font = "bold 58px Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(row + 1), 64, 68);

  canvas.tainted = false;

  return canvas;

}


function loadImage(url, withCors) {

  return new Promise(function (resolve, reject) {

    const img = new Image();

    if (withCors) {
      img.crossOrigin = "anonymous";
    }

    img.onload = function () { resolve(img); };
    img.onerror = reject;

    img.src = url;

  });

}


function imageToMask(img, readable) {

  const factor = MASK_SIZE / Math.max(img.naturalWidth, img.naturalHeight);

  const canvas = document.createElement("canvas");

  canvas.width = Math.max(1, Math.round(img.naturalWidth * factor));
  canvas.height = Math.max(1, Math.round(img.naturalHeight * factor));

  const ctx = canvas.getContext("2d");

  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  canvas.tainted = !readable;

  if (!readable) {
    return canvas;
  }


  /* Helligkeit → Deckkraft */

  const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const px = data.data;

  for (let i = 0; i < px.length; i += 4) {

    const lum = (0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]) / 255;

    const ink = Math.max(0, Math.min(1, (1 - lum) * 1.3));

    px[i] = 0;
    px[i + 1] = 0;
    px[i + 2] = 0;
    px[i + 3] = Math.round(px[i + 3] * ink);

  }

  ctx.putImageData(data, 0, 0);

  return canvas;

}


async function loadMask(row) {

  masks[row] = makeFallbackMask(row);

  const url = SOUNDS[row].bild;

  if (!url) {
    redrawRow(row);
    return;
  }

  try {
    const img = await loadImage(url, true);
    masks[row] = imageToMask(img, true);
  }

  catch (e) {

    /* Ohne Freigabe: anzeigen geht, Bild-Export nicht */

    try {
      const img = await loadImage(url, false);
      masks[row] = imageToMask(img, false);
    }

    catch (e2) {
      console.error("Bild konnte nicht geladen werden:", url);
    }

  }

  redrawRow(row);

}


/* =========================================================
   ZEICHEN DARSTELLEN
   ========================================================= */

let paletteSize = SYMBOL_SIZE;


function drawCell(cell) {

  const row = Number(cell.dataset.row);
  const mask = masks[row];

  if (!mask) {
    return;
  }

  const isPalette = cell.classList.contains("palette-item");

  const color = isPalette
    ? colorFromPitch(currentPitch)
    : colorFromPitch(Number(cell.dataset.pitch === undefined ? 50 : cell.dataset.pitch));


  /* Anzeigegröße aus dem Seitenverhältnis */

  const base = isPalette ? paletteSize : SYMBOL_SIZE;
  const aspect = mask.width / mask.height;

  const w = aspect >= 1 ? base : base * aspect;
  const h = aspect >= 1 ? base / aspect : base;

  cell.style.width = w + "px";
  cell.style.height = h + "px";

  cell.dataset.w = w;
  cell.dataset.h = h;


  /* Nur neu malen, wenn sich etwas geändert hat */

  if (cell._mask === mask && cell._color === color) {
    return;
  }

  cell._mask = mask;
  cell._color = color;

  if (cell.width !== mask.width || cell.height !== mask.height) {
    cell.width = mask.width;
    cell.height = mask.height;
  }

  const ctx = cell.getContext("2d");

  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, cell.width, cell.height);

  ctx.fillStyle = color;
  ctx.fillRect(0, 0, cell.width, cell.height);

  ctx.globalCompositeOperation = "destination-in";
  ctx.drawImage(mask, 0, 0);

  ctx.globalCompositeOperation = "source-over";

}


function redrawRow(row) {

  document
    .querySelectorAll('#klanglandschaft .step[data-row="' + row + '"]')
    .forEach(drawCell);

}


/* =========================================================
   FUNDUS ERZEUGEN
   ========================================================= */

for (let row = 0; row < ROWS; row++) {

  const item = document.createElement("canvas");

  item.classList.add("step", "palette-item");
  item.dataset.row = row;

  paletteIcons.appendChild(item);

}


/* Fundus-Größe an die Höhe anpassen */

function updatePaletteSize() {

  /* Handy quer: zwei Spalten, sonst eine */

  const cols = getComputedStyle(paletteIcons).display === "grid" ? 2 : 1;
  const rows = Math.ceil(ROWS / cols);

  const h = paletteIcons.clientHeight || 400;
  const w = paletteIcons.clientWidth || 60;

  paletteSize = Math.max(18, Math.min(44, h / rows * 0.72, w / cols * 0.8));

  paletteIcons.querySelectorAll(".palette-item").forEach(drawCell);

}

updatePaletteSize();

for (let row = 0; row < ROWS; row++) {
  loadMask(row);
}


/* =========================================================
   FARBREGLER
   Ziehen oder tippen = Farbe wählen,
   Doppeltippen = zurück zur Mitte.
   ========================================================= */

function setPitch(value) {

  currentPitch = Math.max(0, Math.min(100, value));

  if (pitchThumb) {
    pitchThumb.style.background = colorFromPitch(currentPitch);
  }

  if (pitchSlider) {
    /* Position des Griffs regelt das CSS (senkrecht oder waagerecht) */
    pitchSlider.style.setProperty("--pv", currentPitch);
    pitchSlider.setAttribute("aria-valuenow", Math.round(currentPitch));
  }

  paletteIcons.querySelectorAll(".palette-item").forEach(drawCell);

}


if (pitchSlider && PITCH_ON) {

  let pitchPointer = null;

  const pitchFromEvent = function (event) {

    const r = pitchSlider.getBoundingClientRect();

    /* waagerecht (Handy quer): links blau, rechts rot */
    if (r.width > r.height) {
      return (event.clientX - r.left) / r.width * 100;
    }

    /* senkrecht: oben rot, unten blau */
    return (1 - (event.clientY - r.top) / r.height) * 100;

  };

  pitchSlider.addEventListener("pointerdown", function (event) {
    event.preventDefault();
    pitchPointer = event.pointerId;
    try { pitchSlider.setPointerCapture(event.pointerId); } catch (e) {}
    setPitch(pitchFromEvent(event));
  });

  pitchSlider.addEventListener("pointermove", function (event) {
    if (event.pointerId === pitchPointer) {
      setPitch(pitchFromEvent(event));
    }
  });

  const endPitch = function (event) {
    if (event.pointerId === pitchPointer) {
      pitchPointer = null;
      try { pitchSlider.releasePointerCapture(event.pointerId); } catch (e) {}
    }
  };

  pitchSlider.addEventListener("pointerup", endPitch);
  pitchSlider.addEventListener("pointercancel", endPitch);

  pitchSlider.addEventListener("dblclick", function () {
    setPitch(50);
  });

  pitchSlider.addEventListener("keydown", function (event) {
    if (event.key === "ArrowUp" || event.key === "ArrowRight") { setPitch(currentPitch + 5); event.preventDefault(); }
    if (event.key === "ArrowDown" || event.key === "ArrowLeft") { setPitch(currentPitch - 5); event.preventDefault(); }
  });

  setPitch(50);

}

else if (pitchSlider) {
  pitchSlider.style.display = "none";
}


/* =========================================================
   NEUES KLANGZEICHEN
   ========================================================= */

function createSoundCell(row) {

  const cell = document.createElement("canvas");

  cell.classList.add("step", "active");

  cell.dataset.row = row;
  cell.dataset.tick = 0;
  cell.dataset.y = 50;
  cell.dataset.pitch = currentPitch;

  setScale(cell, 1);

  landscape.appendChild(cell);

  drawCell(cell);

  return cell;

}


/* =========================================================
   ZEICHEN POSITIONIEREN
   ========================================================= */

function placeCell(cell, tick, yPercent) {

  tick = Math.max(0, Math.min(TICKS - 1, Math.round(tick)));
  yPercent = Math.max(0, Math.min(100, yPercent));

  cell.dataset.tick = tick;
  cell.dataset.y = yPercent;

  cell.style.left = (tick / TICKS * 100) + "%";
  cell.style.top = yPercent + "%";

  drawCell(cell);

}


function positionCell(cell, clientX, clientY) {

  const rect = landscape.getBoundingClientRect();

  const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
  const y = Math.max(0, Math.min(rect.height, clientY - rect.top));

  /* X rastet unsichtbar auf 1/8-Unterteilungen. */

  placeCell(
    cell,
    x / rect.width * TICKS,
    y / rect.height * 100
  );

}


/* =========================================================
   FUNDUS:
   KURZ ANTIPPEN = KLANG HÖREN
   ZIEHEN = ZEICHEN ERZEUGEN
   ========================================================= */

let newCell = null;
let palettePointer = null;
let paletteStartX = 0;
let paletteStartY = 0;
let paletteRow = null;
let paletteDragging = false;


palette.addEventListener("pointerdown", function (event) {

  const item = event.target.closest(".palette-item");

  if (!item) {
    return;
  }

  event.preventDefault();

  resumeAudio();


  /* Aufnahme-Modus */

  if (recordMode) {

    recordPointer = event.pointerId;

    try { palette.setPointerCapture(event.pointerId); } catch (e) {}

    startRecordingFor(Number(item.dataset.row), item);

    return;

  }

  palettePointer = event.pointerId;
  paletteStartX = event.clientX;
  paletteStartY = event.clientY;
  paletteRow = Number(item.dataset.row);
  paletteDragging = false;

  beginChange();

  try { palette.setPointerCapture(event.pointerId); } catch (e) {}

});


palette.addEventListener("pointermove", function (event) {

  if (event.pointerId !== palettePointer) {
    return;
  }

  const distance = Math.hypot(
    event.clientX - paletteStartX,
    event.clientY - paletteStartY
  );

  if (!paletteDragging && distance >= PALETTE_DRAG_DISTANCE) {

    paletteDragging = true;

    newCell = createSoundCell(paletteRow);
    newCell.classList.add("dragging");

  }

  if (paletteDragging && newCell) {
    positionCell(newCell, event.clientX, event.clientY);
  }

});


function resetPaletteState() {
  newCell = null;
  palettePointer = null;
  paletteRow = null;
  paletteDragging = false;
}


function finishPaletteInteraction(event) {

  if (event.pointerId !== palettePointer) {
    return;
  }

  /* Kein Drag: Klang einmal vorhören (in der eingestellten Farbe). */

  if (!paletteDragging) {

    if (!playSound(paletteRow, 0.5, rateFromPitch(currentPitch), 0)) {
      showMessage("Klang lädt noch …");
    }

  }

  /* Drag: Zeichen ablegen – außerhalb der Fläche = verwerfen. */

  else if (newCell) {

    const rect = landscape.getBoundingClientRect();

    const inside =
      event.clientX >= rect.left &&
      event.clientX <= rect.right &&
      event.clientY >= rect.top &&
      event.clientY <= rect.bottom;

    if (!inside) {
      newCell.remove();
    }

    else {
      positionCell(newCell, event.clientX, event.clientY);
      newCell.classList.remove("dragging");
      selectCell(newCell);
    }

  }

  try { palette.releasePointerCapture(event.pointerId); } catch (e) {}

  resetPaletteState();

  endChange();

}


let recordPointer = null;

function endRecordGesture(event) {

  if (event.pointerId !== recordPointer) {
    return false;
  }

  recordPointer = null;

  try { palette.releasePointerCapture(event.pointerId); } catch (e) {}

  stopRecording();

  return true;

}

palette.addEventListener("pointerup", function (event) {

  if (endRecordGesture(event)) {
    return;
  }

  finishPaletteInteraction(event);

});


palette.addEventListener("pointercancel", function (event) {

  if (endRecordGesture(event)) {
    return;
  }

  if (newCell) {
    newCell.remove();
  }

  try { palette.releasePointerCapture(event.pointerId); } catch (e) {}

  resetPaletteState();

  endChange();

});


/* =========================================================
   ZEICHEN AUF DER FLÄCHE

   Kurz antippen      = auswählen – dann verschieben und
                        mit zwei Fingern vergrößern
   Lange drücken      = an / aus
   Doppelt tippen     = eingestellte Farbe übernehmen
   Leere Stelle tippen = Auswahl aufheben
   ========================================================= */

const LONG_PRESS_TIME = 500;
const MOVE_TOLERANCE = 8;
const DOUBLE_TAP_TIME = 350;

let selectedCell = null;

let startCell = null;
let startWasSelected = false;
let primaryPointer = null;
let mode = null;          // null | "drag" | "pinch" | "longpress" | "ignore"

let startX = 0;
let startY = 0;

let holdTimer = null;

let emptyTap = null;      // Tippen auf leere Stelle

const pointers = new Map();

let pinchCell = null;
let pinchStartDistance = 0;
let pinchStartScale = 1;

let lastTap = { cell: null, time: 0 };


function touchDistance() {

  const points = Array.from(pointers.values());

  if (points.length < 2) {
    return 0;
  }

  return Math.hypot(
    points[0].x - points[1].x,
    points[0].y - points[1].y
  );

}


function setCell(cell, value) {

  if (!cell) {
    return;
  }

  cell.classList.toggle("active", value);

}


function selectCell(cell) {

  if (selectedCell && selectedCell !== cell) {
    selectedCell.classList.remove("selected");
  }

  selectedCell = cell || null;

  if (selectedCell) {
    selectedCell.classList.add("selected");
  }

}


function isOverTrash(x, y) {

  if (!trash) {
    return false;
  }

  const r = trash.getBoundingClientRect();

  return r.width > 0 && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;

}


/* =========================================================
   FREIE ABSPIELLINIE

   Punkte werden relativ zur Fläche gespeichert (0–1),
   damit die Linie beim Drehen des Tablets nicht verrutscht.
   ========================================================= */

let drawingMode = false;
let drawingNow = false;
let drawingPointer = null;

let pathPoints = [];
let playbackPath = [];
let hasCustomPath = false;


function toLocalPoint(clientX, clientY) {

  const rect = landscape.getBoundingClientRect();

  return {
    x: Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)),
    y: Math.max(0, Math.min(1, (clientY - rect.top) / rect.height))
  };

}


function renderPath() {

  drawnPath.setAttribute(
    "points",
    pathPoints
      .map(function (p) {
        return (p.x * 1000) + "," + (p.y * 1000);
      })
      .join(" ")
  );

}


/* Pfad fein abtasten (Abstand in Pixeln) */

function buildPlaybackPath() {

  playbackPath = [];

  if (pathPoints.length < 2) {
    return;
  }

  const rect = landscape.getBoundingClientRect();

  playbackPath.push({ x: pathPoints[0].x, y: pathPoints[0].y });

  for (let i = 1; i < pathPoints.length; i++) {

    const a = pathPoints[i - 1];
    const b = pathPoints[i];

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const distance = Math.hypot(dx * rect.width, dy * rect.height);

    const steps = Math.max(1, Math.ceil(distance / PATH_SAMPLE_DISTANCE));

    for (let s = 1; s <= steps; s++) {

      const t = s / steps;

      playbackPath.push({
        x: a.x + dx * t,
        y: a.y + dy * t
      });

    }

  }

}


/* =========================================================
   STIFT-BUTTON
   ========================================================= */

drawButton.addEventListener("click", function () {

  stopPlayback();

  if (hasCustomPath) {
    rememberState();
  }

  /* Alte Linie vollständig löschen. */

  pathPoints = [];
  playbackPath = [];
  hasCustomPath = false;

  renderPath();

  pathHead.style.opacity = "0";
  playline.style.opacity = "0";

  drawingMode = true;
  drawingNow = false;

  landscape.classList.add("drawing");
  drawButton.classList.add("active");

});


/* =========================================================
   POINTER DOWN AUF DER FLÄCHE
   ========================================================= */

landscape.addEventListener("pointerdown", function (event) {

  /* ---------- LINIE ZEICHNEN ---------- */

  if (drawingMode) {

    event.preventDefault();

    drawingNow = true;
    drawingPointer = event.pointerId;

    pathPoints = [toLocalPoint(event.clientX, event.clientY)];

    renderPath();

    try { landscape.setPointerCapture(event.pointerId); } catch (e) {}

    return;

  }


  const cell = event.target.closest(".step");

  if (event.pointerType === "touch") {
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  }


  /* ---------- ZWEI FINGER: ausgewähltes Zeichen vergrößern ---------- */

  if (event.pointerType === "touch" && pointers.size === 2) {

    event.preventDefault();

    clearTimeout(holdTimer);

    emptyTap = null;

    if (startCell) {
      startCell.classList.remove("dragging");
    }

    pinchCell = selectedCell;

    if (!pinchCell) {
      mode = "ignore";
      return;
    }

    if (pendingState === null) {
      beginChange();
    }

    mode = "pinch";

    pinchStartDistance = touchDistance();
    pinchStartScale = Number(pinchCell.dataset.scale || 1);

    pinchCell.classList.add("dragging");

    return;

  }


  /* ---------- LEERE STELLE ---------- */

  if (!cell) {

    emptyTap = {
      id: event.pointerId,
      x: event.clientX,
      y: event.clientY
    };

    return;

  }


  /* ---------- ZEICHEN ---------- */

  event.preventDefault();

  beginChange();

  startCell = cell;
  startWasSelected = (selectedCell === cell);
  primaryPointer = event.pointerId;

  startX = event.clientX;
  startY = event.clientY;

  mode = null;

  try { landscape.setPointerCapture(event.pointerId); } catch (e) {}


  /* Lange drücken = an / aus */

  clearTimeout(holdTimer);

  holdTimer = setTimeout(function () {

    if (mode !== null || !startCell) {
      return;
    }

    mode = "longpress";

    setCell(startCell, !startCell.classList.contains("active"));

    try {
      if (navigator.vibrate) {
        navigator.vibrate(12);
      }
    }
    catch (e) {}

  }, LONG_PRESS_TIME);

});


/* =========================================================
   POINTER MOVE
   ========================================================= */

landscape.addEventListener("pointermove", function (event) {

  /* ---------- LINIE ---------- */

  if (drawingMode && drawingNow && event.pointerId === drawingPointer) {

    event.preventDefault();

    const rect = landscape.getBoundingClientRect();

    const point = toLocalPoint(event.clientX, event.clientY);
    const previous = pathPoints[pathPoints.length - 1];

    if (
      !previous ||
      Math.hypot(
        (point.x - previous.x) * rect.width,
        (point.y - previous.y) * rect.height
      ) >= 2
    ) {
      pathPoints.push(point);
      renderPath();
    }

    return;

  }


  /* ---------- TOUCH ---------- */

  if (event.pointerType === "touch" && pointers.has(event.pointerId)) {
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  }


  /* leere Stelle: bei Bewegung kein "Tippen" mehr */

  if (emptyTap && event.pointerId === emptyTap.id) {

    if (Math.hypot(event.clientX - emptyTap.x, event.clientY - emptyTap.y) > MOVE_TOLERANCE) {
      emptyTap = null;
    }

  }


  /* ---------- VERGRÖSSERN ---------- */

  if (mode === "pinch" && pinchCell && pointers.size >= 2) {

    event.preventDefault();

    const distance = touchDistance();

    if (pinchStartDistance <= 0) {
      return;
    }

    setScale(pinchCell, pinchStartScale * (distance / pinchStartDistance));

    return;

  }


  if (!startCell || event.pointerId !== primaryPointer) {
    return;
  }

  const distance = Math.hypot(
    event.clientX - startX,
    event.clientY - startY
  );


  /* Bewegung beginnt: nur ausgewählte Zeichen lassen sich schieben */

  if (mode === null && distance > MOVE_TOLERANCE) {

    clearTimeout(holdTimer);

    if (startWasSelected) {
      mode = "drag";
      startCell.classList.add("dragging");
    }
    else {
      mode = "ignore";
    }

  }


  /* ---------- VERSCHIEBEN ---------- */

  if (mode === "drag") {

    event.preventDefault();

    positionCell(startCell, event.clientX, event.clientY);

    if (trash) {
      trash.classList.toggle("hover", isOverTrash(event.clientX, event.clientY));
    }

  }

});


/* =========================================================
   POINTER ENDE
   ========================================================= */

function releaseCapture(pointerId) {

  try {
    if (landscape.hasPointerCapture(pointerId)) {
      landscape.releasePointerCapture(pointerId);
    }
  }
  catch (e) {}

}


function finishPointer(event) {

  /* ---------- LINIE FERTIG ---------- */

  if (drawingMode && drawingNow && event.pointerId === drawingPointer) {

    drawingNow = false;
    drawingPointer = null;

    if (pathPoints.length >= 2) {
      buildPlaybackPath();
      hasCustomPath = playbackPath.length >= 2;
    }

    drawingMode = false;

    landscape.classList.remove("drawing");
    drawButton.classList.remove("active");

    releaseCapture(event.pointerId);

    return;

  }


  clearTimeout(holdTimer);

  if (event.pointerType === "touch") {
    pointers.delete(event.pointerId);
  }


  /* ---------- LEERE STELLE GETIPPT = Auswahl aufheben ---------- */

  if (emptyTap && event.pointerId === emptyTap.id) {

    if (event.type === "pointerup" && mode !== "pinch") {
      selectCell(null);
    }

    emptyTap = null;

  }


  /* ---------- VERGRÖSSERN ENDE ---------- */

  if (mode === "pinch") {

    if (pointers.size < 2) {

      if (pinchCell) {
        pinchCell.classList.remove("dragging");
      }

      pinchCell = null;
      startCell = null;
      primaryPointer = null;
      mode = null;

      endChange();

    }

    return;

  }


  if (event.pointerId !== primaryPointer) {

    if (mode === "ignore" && pointers.size === 0) {
      mode = null;
    }

    return;

  }


  if (startCell) {

    /* ---------- KURZ TIPPEN ---------- */

    if (mode === null) {

      const now = Date.now();

      /* zweimal schnell = Farbe übernehmen */

      if (lastTap.cell === startCell && now - lastTap.time < DOUBLE_TAP_TIME) {

        startCell.dataset.pitch = currentPitch;
        drawCell(startCell);

        lastTap = { cell: null, time: 0 };

      }

      else {
        lastTap = { cell: startCell, time: now };
      }

      selectCell(startCell);

    }


    /* ---------- VERSCHIEBEN ENDE ---------- */

    else if (mode === "drag") {

      const rect = landscape.getBoundingClientRect();

      if (trash) {
        trash.classList.remove("hover");
      }

      /* Auf den Papierkorb oder zurück zum Fundus = löschen */

      if (isOverTrash(event.clientX, event.clientY) || event.clientX < rect.left) {

        if (selectedCell === startCell) {
          selectCell(null);
        }

        startCell.remove();

      }

      else {
        startCell.classList.remove("dragging");
      }

    }

  }

  releaseCapture(event.pointerId);

  startCell = null;
  startWasSelected = false;
  primaryPointer = null;
  mode = null;

  endChange();

}


landscape.addEventListener("pointerup", finishPointer);
landscape.addEventListener("pointercancel", finishPointer);


/* =========================================================
   LAPTOP-TOUCHPAD PINCH
   ========================================================= */

let lastWheelTime = 0;

landscape.addEventListener("wheel", function (event) {

  if (drawingMode || !event.ctrlKey || !selectedCell) {
    return;
  }

  event.preventDefault();

  if (Date.now() - lastWheelTime > 600) {
    rememberState();
  }

  lastWheelTime = Date.now();

  const oldScale = Number(selectedCell.dataset.scale || 1);
  const factor = Math.exp(-event.deltaY * 0.018);

  setScale(selectedCell, oldScale * factor);

}, { passive: false });


/* =========================================================
   TEMPO
   ========================================================= */

let bpm = Number(tempoSlider.value);

function showTempo() {

  if (tempoValue) {
    tempoValue.textContent = bpm + " BPM";
  }

  if (typeof updateTempoVertical === "function") {
    updateTempoVertical();
  }

}

showTempo();

/* Handy quer: Tempo-Fach antippen = Regler ein-/ausblenden */

const PHONE_QUERY = "(orientation: landscape) and (max-height: 500px)";

if (tempoGroup) {

  tempoGroup.addEventListener("click", function (event) {

    if (!matchMedia(PHONE_QUERY).matches || event.target === tempoSlider) {
      return;
    }

    tempoGroup.classList.toggle("open");

  });

  document.addEventListener("pointerdown", function (event) {

    if (tempoGroup.classList.contains("open") && !tempoGroup.contains(event.target)) {
      tempoGroup.classList.remove("open");
    }

  });

}


tempoSlider.addEventListener("input", function () {
  bpm = Number(this.value);
  showTempo();
});


/* Dauer eines Ticks in Sekunden */

function tickSeconds() {
  return (60 / bpm) / 4 / SUBDIVISIONS;
}


/* Freie Linie und waagerechter Player haben dieselbe Gesamtdauer. */

function loopSeconds() {
  return tickSeconds() * TICKS;
}


/* =========================================================
   PLAYBACK STATUS
   ========================================================= */

let playing = false;
let schedulerTimer = null;
let animationFrame = null;

let nextTickTime = 0;
let scheduleTick = 0;
let visualQueue = [];

let pathStartTime = null;
let previousPathIndex = -1;
let touchedCells = new Set();


/* Zeichen wird kurz heller, wenn es klingt */

function flashCell(cell) {

  if (!cell || !cell.isConnected) {
    return;
  }

  cell.classList.remove("hit");
  void cell.offsetWidth;   // Animation neu starten
  cell.classList.add("hit");

}


function cellSound(cell) {

  return {
    row: Number(cell.dataset.row),
    volume: Number(cell.dataset.volume || 0.35),
    rate: rateFromPitch(Number(cell.dataset.pitch === undefined ? 50 : cell.dataset.pitch))
  };

}


/* =========================================================
   WAAGERECHTER PLAYER

   Klänge werden ein Stück im Voraus auf der Audio-Uhr
   geplant. Dadurch bleibt der Rhythmus stabil, auch bei
   vielen Zeichen und auf langsamen Geräten.

   Linker Rand des Zeichens = Startpunkt.
   ========================================================= */

function buildTickMap() {

  const width = landscape.clientWidth || 1;

  const map = new Map();

  landscape.querySelectorAll(".step.active").forEach(function (cell) {

    const center = Number(cell.dataset.tick) / TICKS;
    const half = Number(cell.dataset.w || SYMBOL_SIZE) *
                 Number(cell.dataset.scale || 1) / 2;

    let tick = Math.round((center - half / width) * TICKS);

    tick = Math.max(0, Math.min(TICKS - 1, tick));

    if (!map.has(tick)) {
      map.set(tick, []);
    }

    const sound = cellSound(cell);
    sound.cell = cell;

    map.get(tick).push(sound);

  });

  return map;

}


function scheduler() {

  if (!playing) {
    return;
  }

  const map = buildTickMap();

  while (nextTickTime < audioContext.currentTime + LOOKAHEAD) {

    const sounds = map.get(scheduleTick);

    if (sounds) {
      sounds.forEach(function (s) {
        playSound(s.row, s.volume, s.rate, nextTickTime);
      });
    }

    visualQueue.push({ tick: scheduleTick, time: nextTickTime, sounds: sounds || null });

    nextTickTime += tickSeconds();

    scheduleTick = (scheduleTick + 1) % TICKS;

  }

}


function animatePlayline() {

  if (!playing) {
    return;
  }

  const now = audioContext.currentTime;

  while (visualQueue.length && visualQueue[0].time <= now) {

    const item = visualQueue.shift();

    playline.style.left = (item.tick / TICKS * 100) + "%";
    playline.style.opacity = ".75";

    if (item.sounds) {
      item.sounds.forEach(function (sound) {
        flashCell(sound.cell);
      });
    }

  }

  animationFrame = requestAnimationFrame(animatePlayline);

}


/* =========================================================
   FREIE LINIE
   ========================================================= */

function activeCellRects() {

  const base = landscape.getBoundingClientRect();

  return Array.from(landscape.querySelectorAll(".step.active")).map(function (cell) {

    const r = cell.getBoundingClientRect();

    return {
      cell: cell,
      left: r.left - base.left,
      right: r.right - base.left,
      top: r.top - base.top,
      bottom: r.bottom - base.top
    };

  });

}


function processPathPoint(point, rects, width, height) {

  const x = point.x * width;
  const y = point.y * height;

  const cellsNow = new Set();

  rects.forEach(function (r) {

    if (x < r.left || x > r.right || y < r.top || y > r.bottom) {
      return;
    }

    cellsNow.add(r.cell);

    /* Nur beim Eintritt auslösen. */

    if (!touchedCells.has(r.cell)) {
      const s = cellSound(r.cell);
      playSound(s.row, s.volume, s.rate, 0);
      flashCell(r.cell);
    }

  });

  touchedCells = cellsNow;

}


function animatePath() {

  if (!playing) {
    return;
  }

  if (playbackPath.length < 2) {
    stopPlayback();
    return;
  }

  const now = audioContext.currentTime;

  if (pathStartTime === null) {
    pathStartTime = now;
  }

  const duration = loopSeconds();

  let elapsed = now - pathStartTime;

  /* Neuer Durchlauf. */

  if (elapsed >= duration) {

    pathStartTime += Math.floor(elapsed / duration) * duration;
    elapsed = now - pathStartTime;

    previousPathIndex = -1;
    touchedCells = new Set();

  }

  const progress = Math.max(0, Math.min(1, elapsed / duration));

  const targetIndex = Math.min(
    playbackPath.length - 1,
    Math.floor(progress * playbackPath.length)
  );

  const startIndex = Math.max(0, previousPathIndex + 1);

  if (targetIndex >= startIndex) {

    const rect = landscape.getBoundingClientRect();
    const rects = activeCellRects();

    for (let i = startIndex; i <= targetIndex; i++) {
      processPathPoint(playbackPath[i], rects, rect.width, rect.height);
    }

  }

  previousPathIndex = targetIndex;

  const p = playbackPath[targetIndex];

  pathHead.setAttribute("cx", p.x * 1000);
  pathHead.setAttribute("cy", p.y * 1000);
  pathHead.style.opacity = "1";

  animationFrame = requestAnimationFrame(animatePath);

}


/* =========================================================
   PLAY / STOP
   ========================================================= */

async function startPlayback() {

  if (playing || drawingMode) {
    return;
  }

  await resumeAudio();

  playing = true;
  touchedCells = new Set();

  updatePlayButton();

  if (hasCustomPath && playbackPath.length >= 2) {

    playline.style.opacity = "0";

    pathStartTime = null;
    previousPathIndex = -1;

    animationFrame = requestAnimationFrame(animatePath);

  }

  else {

    pathHead.style.opacity = "0";

    scheduleTick = 0;
    visualQueue = [];
    nextTickTime = audioContext.currentTime + 0.05;

    scheduler();

    schedulerTimer = setInterval(scheduler, SCHEDULE_INTERVAL);

    animationFrame = requestAnimationFrame(animatePlayline);

  }

}

function updatePlayButton() {
  playButton.classList.toggle("playing", playing);
  playButton.setAttribute("aria-label", playing ? "Stopp" : "Spielen");
}

playButton.addEventListener("click", function () {
  if (recordMode) {
    leaveRecordMode();
  }
  if (playing) {
    stopPlayback();
  }
  else {
    startPlayback();
  }
});


function stopPlayback() {

  playing = false;

  updatePlayButton();

  clearInterval(schedulerTimer);
  schedulerTimer = null;

  if (animationFrame !== null) {
    cancelAnimationFrame(animationFrame);
  }

  animationFrame = null;

  visualQueue = [];
  pathStartTime = null;
  previousPathIndex = -1;
  touchedCells = new Set();

  playline.style.opacity = "0";
  pathHead.style.opacity = "0";

}

if (stopButton) {
  stopButton.addEventListener("click", stopPlayback);
}


/* =========================================================
   RÜCKGÄNGIG

   Vor jeder Änderung wird der Zustand gemerkt
   (Zeichen + Linie, nicht das Tempo).
   ========================================================= */

const HISTORY_MAX = 40;

let history = [];
let pendingState = null;


function getState() {

  const cells = [];

  landscape.querySelectorAll(".step").forEach(function (cell) {
    cells.push({
      row: Number(cell.dataset.row),
      tick: Number(cell.dataset.tick),
      y: Number(cell.dataset.y),
      scale: Number(cell.dataset.scale || 1),
      pitch: Number(cell.dataset.pitch === undefined ? 50 : cell.dataset.pitch),
      active: cell.classList.contains("active")
    });
  });

  const path = hasCustomPath
    ? pathPoints.map(function (p) { return { x: p.x, y: p.y }; })
    : [];

  return JSON.stringify({ cells: cells, path: path });

}


function applyState(json) {

  const state = JSON.parse(json);

  landscape.querySelectorAll(".step").forEach(function (cell) {
    cell.remove();
  });

  selectedCell = null;

  state.cells.forEach(function (c) {

    const cell = createSoundCell(c.row);

    cell.dataset.pitch = c.pitch;

    placeCell(cell, c.tick, c.y);
    setScale(cell, c.scale);

    cell.classList.toggle("active", c.active);

  });

  pathPoints = state.path;

  renderPath();

  if (pathPoints.length >= 2) {
    buildPlaybackPath();
    hasCustomPath = playbackPath.length >= 2;
  }

  else {
    playbackPath = [];
    hasCustomPath = false;
    pathHead.style.opacity = "0";
  }

}


function updateUndoButton() {
  if (undoButton) {
    undoButton.disabled = history.length === 0;
  }
}


function pushHistory(state) {

  if (history.length && history[history.length - 1] === state) {
    return;
  }

  history.push(state);

  if (history.length > HISTORY_MAX) {
    history.shift();
  }

  updateUndoButton();

}


/* Für Änderungen, die sofort passieren */

function rememberState() {
  pushHistory(getState());
}


/* Für Gesten: Anfang merken, am Ende nur speichern,
   wenn sich wirklich etwas geändert hat. */

function beginChange() {
  pendingState = getState();
}

function endChange() {

  if (pendingState !== null && getState() !== pendingState) {
    pushHistory(pendingState);
  }

  pendingState = null;

}


function undo() {

  if (!history.length) {
    return;
  }

  /* falls gerade der Stift aktiv ist: abbrechen */

  if (drawingMode) {
    drawingMode = false;
    drawingNow = false;
    drawingPointer = null;
    landscape.classList.remove("drawing");
    drawButton.classList.remove("active");
  }

  applyState(history.pop());

  updateUndoButton();

}


if (undoButton) {
  undoButton.addEventListener("click", undo);
}

updateUndoButton();
