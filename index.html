/* =========================================================
   KOMPAKTE KODIERUNG

   Zahlen werden mit 64 Zeichen geschrieben.
   2 Zeichen reichen für Werte bis 4095.
   ========================================================= */

const B64 =
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

function enc(n, len) {

  const max = Math.pow(64, len) - 1;

  n = Math.max(0, Math.min(max, Math.round(n)));

  let s = "";

  for (let i = 0; i < len; i++) {
    s = B64[n % 64] + s;
    n = Math.floor(n / 64);
  }

  return s;

}

function dec(str) {

  let n = 0;

  for (const ch of str) {
    const v = B64.indexOf(ch);
    if (v < 0) {
      return NaN;
    }
    n = n * 64 + v;
  }

  return n;

}


/* =========================================================
   LINIE VEREINFACHEN (für die Speicherung)
   ========================================================= */

function distanceToSegment(p, a, b) {

  const dx = b.x - a.x;
  const dy = b.y - a.y;

  const length = Math.hypot(dx, dy);

  if (length === 0) {
    return Math.hypot(p.x - a.x, p.y - a.y);
  }

  return Math.abs(dx * (a.y - p.y) - dy * (a.x - p.x)) / length;

}


function simplifyPath(points, tolerance) {

  const n = points.length;

  if (n < 3) {
    return points.slice();
  }

  const keep = new Uint8Array(n);

  keep[0] = 1;
  keep[n - 1] = 1;

  const stack = [[0, n - 1]];

  while (stack.length) {

    const range = stack.pop();
    const start = range[0];
    const end = range[1];

    let maxDistance = 0;
    let index = -1;

    for (let i = start + 1; i < end; i++) {

      const d = distanceToSegment(points[i], points[start], points[end]);

      if (d > maxDistance) {
        maxDistance = d;
        index = i;
      }

    }

    if (maxDistance > tolerance && index > 0) {
      keep[index] = 1;
      stack.push([start, index], [index, end]);
    }

  }

  return points.filter(function (p, i) {
    return keep[i];
  });

}


/* =========================================================
   PARTITUR → KURZER CODE (wird ins Bild geschrieben)

   Format:  3 . Tempo . Zeichen . Linie

   Zeichen (10 Zeichen):
     Reihe(1) Tick(2) Höhe(2) Größe(2) Farbe(2) an/aus(1)

   Linienpunkt (4 Zeichen): x(2) y(2), 0–1000
   ========================================================= */

function serializeScore() {

  let cells = "";

  landscape.querySelectorAll(".step").forEach(function (cell) {

    cells +=
      enc(Number(cell.dataset.row), 1) +
      enc(Number(cell.dataset.tick), 2) +
      enc(Number(cell.dataset.y) * 10, 2) +
      enc(Number(cell.dataset.scale || 1) * 100, 2) +
      enc(Number(cell.dataset.pitch === undefined ? 50 : cell.dataset.pitch) * 10, 2) +
      (cell.classList.contains("active") ? "1" : "0");

  });

  let path = "";

  if (hasCustomPath && pathPoints.length >= 2) {

    const scaled = pathPoints.map(function (p) {
      return { x: p.x * 1000, y: p.y * 1000 };
    });

    simplifyPath(scaled, SIMPLIFY_TOLERANCE).forEach(function (p) {
      path += enc(p.x, 2) + enc(p.y, 2);
    });

  }

  const title = scoreTitle
    ? encodeURIComponent(scoreTitle.value.trim()).replace(/\./g, "%2E")
    : "";

  return ["3", enc(bpm, 2), cells, path, GRUPPE, title].join(".");

}


/* =========================================================
   CODE LESEN
   (Version 1 + 2 = ältere Bilder, Version 3 = aktuell)
   ========================================================= */

function parseScore(code) {

  const score = { bpm: 0, cells: [], path: [] };

  if (code.indexOf("2.") === 0 || code.indexOf("3.") === 0) {

    const v3 = code.indexOf("3.") === 0;
    const size = v3 ? 10 : 8;

    const parts = code.split(".");

    score.gruppe = parts[4] || "";

    try {
      score.title = parts[5] ? decodeURIComponent(parts[5]) : "";
    }
    catch (e) {
      score.title = "";
    }

    score.bpm = dec(parts[1] || "");

    const cells = parts[2] || "";

    for (let i = 0; i + size <= cells.length; i += size) {

      score.cells.push({
        row: dec(cells.substr(i, 1)),
        tick: dec(cells.substr(i + 1, 2)),
        y: dec(cells.substr(i + 3, 2)),
        scale: dec(cells.substr(i + 5, 2)),
        pitch: v3 ? dec(cells.substr(i + 7, 2)) / 10 : 50,
        active: cells.substr(i + size - 1, 1) === "1"
      });

    }

    const path = parts[3] || "";

    for (let i = 0; i + 4 <= path.length; i += 4) {

      score.path.push({
        x: dec(path.substr(i, 2)),
        y: dec(path.substr(i + 2, 2))
      });

    }

    return score;

  }

  const parts = code.split("~");

  if (parts[0] !== "1") {
    return null;
  }

  score.bpm = Number(parts[1]);

  (parts[2] || "").split("_").forEach(function (entry) {

    if (!entry) {
      return;
    }

    const v = entry.split(".").map(Number);

    score.cells.push({
      row: v[0], tick: v[1], y: v[2], scale: v[3], active: v[4] === 1
    });

  });

  (parts[3] || "").split("_").forEach(function (entry) {

    if (!entry) {
      return;
    }

    const v = entry.split(".").map(Number);

    score.path.push({ x: v[0], y: v[1] });

  });

  return score;

}


/* =========================================================
   CODE → PARTITUR
   ========================================================= */

/*
   origAspect = Seitenverhältnis (Breite/Höhe) der Fläche,
   auf der die Partitur gespeichert wurde. Ist es bekannt,
   wird die Partitur unverzerrt eingepasst: gleichmäßig
   skaliert und mittig gesetzt, statt in die Breite oder
   Höhe gezogen. Ohne Angabe: wie bisher.
*/

function loadScore(code, origAspect) {

  const score = parseScore(code);

  if (!score) {
    return false;
  }

  clearScore();


  /* Einpassen ohne Verzerrung (alle Werte relativ 0–1) */

  let fitW = 1;
  let fitH = 1;
  let offX = 0;
  let offY = 0;

  const rect = landscape.getBoundingClientRect();

  if (origAspect && rect.width && rect.height) {

    const aspect = rect.width / rect.height;

    if (aspect > origAspect) {
      fitW = origAspect / aspect;
      offX = (1 - fitW) / 2;
    }

    else {
      fitH = aspect / origAspect;
      offY = (1 - fitH) / 2;
    }

  }

  function fitX(xn) { return offX + xn * fitW; }
  function fitY(yn) { return offY + yn * fitH; }

  if (score.bpm) {
    tempoSlider.value = score.bpm;
    bpm = Number(tempoSlider.value);
    showTempo();
  }

  score.cells.forEach(function (c) {

    if ([c.row, c.tick, c.y, c.scale].some(isNaN)) {
      return;
    }

    if (c.row < 0 || c.row >= ROWS) {
      return;
    }

    const cell = createSoundCell(c.row);

    cell.dataset.pitch = (c.pitch === undefined || isNaN(c.pitch)) ? 50 : c.pitch;

    placeCell(
      cell,
      fitX(c.tick / TICKS) * TICKS,
      fitY(c.y / 1000) * 100
    );

    setScale(cell, c.scale / 100);

    cell.classList.toggle("active", c.active);

  });

  pathPoints = score.path
    .filter(function (p) {
      return !isNaN(p.x) && !isNaN(p.y);
    })
    .map(function (p) {
      return { x: fitX(p.x / 1000), y: fitY(p.y / 1000) };
    });

  renderPath();

  if (pathPoints.length >= 2) {
    buildPlaybackPath();
    hasCustomPath = playbackPath.length >= 2;
  }

  if (scoreTitle) {
    scoreTitle.value = score.title || "";
    updateTitleDisplay();
  }

  return true;

}


/* =========================================================
   PARTITUR ALS BILD (PNG)
   ========================================================= */

function renderScoreImage() {

  const rect = landscape.getBoundingClientRect();

  const w = rect.width;
  const h = rect.height;

  const ratio = Math.min(2, window.devicePixelRatio || 1);

  const canvas = document.createElement("canvas");

  canvas.width = Math.round(w * ratio);
  canvas.height = Math.round(h * ratio);

  const ctx = canvas.getContext("2d");

  ctx.scale(ratio, ratio);


  /* Papier */

  ctx.fillStyle = "#f2f0e9";
  ctx.fillRect(0, 0, w, h);


  /* Zeichen */

  landscape.querySelectorAll(".step").forEach(function (cell) {

    const scale = Number(cell.dataset.scale || 1);

    const cw = Number(cell.dataset.w || SYMBOL_SIZE) * scale;
    const ch = Number(cell.dataset.h || SYMBOL_SIZE) * scale;

    const x = Number(cell.dataset.tick) / TICKS * w;
    const y = Number(cell.dataset.y) / 100 * h;

    ctx.globalAlpha = cell.classList.contains("active") ? 1 : 0.22;

    /* wie Druckfarben übereinander */
    ctx.globalCompositeOperation = "multiply";

    ctx.drawImage(cell, x - cw / 2, y - ch / 2, cw, ch);

  });

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";


  /* Titel */

  if (scoreTitle && scoreTitle.value.trim()) {

    ctx.fillStyle = "#141414";
    ctx.font = "700 " + (w < 700 ? 13 : 16) + "px 'Atkinson Hyperlegible', 'Trebuchet MS', sans-serif";
    ctx.textBaseline = "top";
    ctx.textAlign = "right";
    ctx.fillText(scoreTitle.value.trim(), w - 12, 10);
    ctx.textAlign = "left";

  }


  /* Linie */

  if (pathPoints.length >= 2) {

    ctx.save();

    ctx.globalAlpha = 0.75;
    ctx.strokeStyle = "#7a7a7a";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.beginPath();
    ctx.moveTo(pathPoints[0].x * w, pathPoints[0].y * h);

    for (let i = 1; i < pathPoints.length; i++) {
      ctx.lineTo(pathPoints[i].x * w, pathPoints[i].y * h);
    }

    ctx.stroke();

    ctx.restore();

  }

  return canvas;

}


/* =========================================================
   PARTITUR IM BILD VERSTECKEN (PNG-Textabschnitt)
   ========================================================= */

const PNG_KEYWORD = "klanglandschaft";

const PNG_SIGNATURE = [137, 80, 78, 71, 13, 10, 26, 10];


const CRC_TABLE = (function () {

  const table = new Uint32Array(256);

  for (let n = 0; n < 256; n++) {

    let c = n;

    for (let k = 0; k < 8; k++) {
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }

    table[n] = c >>> 0;

  }

  return table;

})();


function crc32(bytes) {

  let c = 0xFFFFFFFF;

  for (let i = 0; i < bytes.length; i++) {
    c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  }

  return (c ^ 0xFFFFFFFF) >>> 0;

}


function textToBytes(text) {

  const bytes = new Uint8Array(text.length);

  for (let i = 0; i < text.length; i++) {
    bytes[i] = text.charCodeAt(i) & 0xFF;
  }

  return bytes;

}


function bytesToText(bytes) {

  let text = "";

  for (let i = 0; i < bytes.length; i++) {
    text += String.fromCharCode(bytes[i]);
  }

  return text;

}


async function addScoreToPng(blob, code) {

  const png = new Uint8Array(await blob.arrayBuffer());

  const body = textToBytes("tEXt" + PNG_KEYWORD + "\0" + code);

  const chunk = new Uint8Array(4 + body.length + 4);
  const view = new DataView(chunk.buffer);

  view.setUint32(0, body.length - 4);
  chunk.set(body, 4);
  view.setUint32(4 + body.length, crc32(body));

  const insertAt = 33;   // direkt nach IHDR

  return new Blob(
    [png.slice(0, insertAt), chunk, png.slice(insertAt)],
    { type: "image/png" }
  );

}


/* Breite/Höhe des gespeicherten Bildes = Seitenverhältnis
   der Fläche, auf der es entstanden ist. */

function readPngAspect(buffer) {

  try {

    const view = new DataView(buffer);

    const w = view.getUint32(16);
    const h = view.getUint32(20);

    return (w > 0 && h > 0) ? w / h : null;

  }

  catch (e) {
    return null;
  }

}


function readScoreFromPng(buffer) {

  const png = new Uint8Array(buffer);

  for (let i = 0; i < 8; i++) {
    if (png[i] !== PNG_SIGNATURE[i]) {
      return null;
    }
  }

  const view = new DataView(buffer);

  let pos = 8;

  while (pos + 8 <= png.length) {

    const length = view.getUint32(pos);
    const type = bytesToText(png.subarray(pos + 4, pos + 8));

    if (type === "tEXt") {

      const data = png.subarray(pos + 8, pos + 8 + length);
      const zero = data.indexOf(0);

      if (zero > 0 && bytesToText(data.subarray(0, zero)) === PNG_KEYWORD) {
        return bytesToText(data.subarray(zero + 1));
      }

    }

    if (type === "IEND") {
      break;
    }

    pos += 12 + length;

  }

  return null;

}


/* =========================================================
   BILD SPEICHERN – direkt herunterladen
   ========================================================= */

/*
   Cargo fängt Link-Klicks auf der Seite ab und öffnet sie
   im selben Tab. Deshalb wird der Download-Link NICHT in
   die Seite eingefügt – so bekommt Cargo den Klick nicht mit.
   Falls ein Browser den Download nicht direkt kann,
   öffnet sich das Bild in einem neuen Tab.
*/

function downloadBlob(blob, filename) {

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");

  link.href = url;
  link.download = filename;
  link.target = "_blank";
  link.rel = "noopener";

  link.addEventListener("click", function (event) {
    event.stopPropagation();
  });

  link.click();

  /* URL nicht sofort zerstören – ein neuer Tab braucht sie noch. */

  setTimeout(function () {
    URL.revokeObjectURL(url);
  }, 60000);

}


async function saveImage(event) {

  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  let blob = null;

  try {

    const canvas = renderScoreImage();

    blob = await new Promise(function (resolve, reject) {
      try { canvas.toBlob(resolve, "image/png"); }
      catch (e) { reject(e); }
    });

  }

  catch (e) {
    console.error(e);
    showMessage("Bild-Export nicht möglich: Zeichnungen sind nicht freigegeben.");
    return;
  }

  if (!blob) {
    showMessage("Das Bild konnte nicht erzeugt werden.");
    return;
  }

  try {
    blob = await addScoreToPng(blob, serializeScore());
  }
  catch (e) {
    console.error(e);
  }

  const name = scoreTitle
    ? scoreTitle.value.trim().replace(/[\\/:*?"<>|]+/g, "").slice(0, 40)
    : "";

  downloadBlob(blob, (name || "klanglandschaft") + ".png");

  showMessage("Bild gespeichert.");

}

if (saveImageButton) {

async function loadFromImageFile(file) {

  if (!file) {
    return;

  let code = null;
  let aspect = null;

  try {
    const buffer = await file.arrayBuffer();
    code = readScoreFromPng(buffer);
    aspect = readPngAspect(buffer);
  }
  catch (e) {
    code = null;
  }

  const before = getState();

  if (!code || !loadScore(code, aspect)) {
    showMessage("In diesem Bild steckt keine Partitur.");
    return;
  }

  pushHistory(before);

  const herkunft = parseScore(code).gruppe;

  if (herkunft && herkunft !== GRUPPE) {
    showMessage("Partitur geladen – sie stammt aus Gruppe „" + herkunft + "“.");
    return;
  }

  showMessage("Partitur geladen.");

}

/* =========================================================
   AUFNEHMEN (nur auf Seiten mit Mikrofon-Knopf #mic)

   Mikrofon-Knopf antippen = Aufnahme-Modus an/aus.
   Im Aufnahme-Modus: ein Zeichen im Fundus GEDRÜCKT HALTEN
   und dabei das Geräusch machen. Loslassen = fertig.

   Die Aufnahme wird automatisch zugeschnitten (Stille am
   Anfang und Ende weg) und auf gleiche Lautstärke gebracht.
   Sie bleibt auf diesem Gerät gespeichert, auch nach dem
   Neuladen. Im Aufnahme-Modus löscht ✕ alle Aufnahmen.
   ========================================================= */

const MAX_RECORDING_MS = 4000;

let recordMode = false;
let micStream = null;
let recorder = null;
let recordChunks = [];
let recordTimer = null;
let recordItem = null;


function recordingKey(row) {
  return "aufnahme:" + GRUPPE + ":" + row;
}


/* ---------- kleine Datenbank im Browser ---------- */

function openRecordingDB() {

  return new Promise(function (resolve, reject) {

    if (!window.indexedDB) {
      reject(new Error("kein IndexedDB"));
      return;
    }

    const request = indexedDB.open("klanglandschaft", 1);

    request.onupgradeneeded = function () {
      request.result.createObjectStore("aufnahmen");
    };

    request.onsuccess = function () { resolve(request.result); };
    request.onerror = function () { reject(request.error); };

  });

}


async function dbRequest(mode, action) {

  const db = await openRecordingDB();

  return new Promise(function (resolve, reject) {

    const tx = db.transaction("aufnahmen", mode);
    const request = action(tx.objectStore("aufnahmen"));

    tx.oncomplete = function () { resolve(request ? request.result : undefined); };
    tx.onerror = function () { reject(tx.error); };

  });

}


/* ---------- Aufnahme bearbeiten ---------- */

function processRecording(raw) {

  const rate = raw.sampleRate;
  const length = raw.length;


  /* Mono */

  const mono = new Float32Array(length);

  for (let c = 0; c < raw.numberOfChannels; c++) {
    const data = raw.getChannelData(c);
    for (let i = 0; i < length; i++) {
      mono[i] += data[i] / raw.numberOfChannels;
    }
  }


  /* Lautester Punkt */

  let peak = 0;

  for (let i = 0; i < length; i++) {
    const a = Math.abs(mono[i]);
    if (a > peak) {
      peak = a;
    }
  }

  if (peak < 0.003) {
    return null;   // nichts zu hören
  }


  /* Stille vorne und hinten abschneiden */

  const threshold = Math.max(peak * 0.04, 0.002);

  let start = 0;
  while (start < length && Math.abs(mono[start]) < threshold) {
    start++;
  }

  let end = length - 1;
  while (end > start && Math.abs(mono[end]) < threshold) {
    end--;
  }

  start = Math.max(0, start - Math.round(rate * 0.01));
  end = Math.min(length - 1, end + Math.round(rate * 0.08));

  const size = Math.max(1, end - start + 1);


  /* Gleiche Lautstärke + kurze Blenden gegen Knackser */

  const out = audioContext.createBuffer(1, size, rate);
  const data = out.getChannelData(0);

  const gain = 0.9 / peak;
  const fadeIn = Math.min(size, Math.round(rate * 0.004));
  const fadeOut = Math.min(size, Math.round(rate * 0.03));

  for (let i = 0; i < size; i++) {

    let v = mono[start + i] * gain;

    if (i < fadeIn) {
      v *= i / fadeIn;
    }

    if (i > size - fadeOut) {
      v *= (size - i) / fadeOut;
    }

    data[i] = v;

  }

  return out;

}


/* ---------- Gespeicherte Aufnahmen laden ---------- */

async function applyStoredRecording(row, stored) {

  try {

    const raw = await audioContext.decodeAudioData(stored.data.slice(0));
    const processed = processRecording(raw);

    if (processed) {
      recordedRows.add(row);
      buffers[row] = processed;
    }

  }

  catch (e) {
    console.error("Aufnahme konnte nicht gelesen werden:", e);
  }

}


async function loadStoredRecordings() {

  for (let row = 0; row < ROWS; row++) {

    try {

      const stored = await dbRequest("readonly", function (store) {
        return store.get(recordingKey(row));
      });

      if (stored && stored.data) {
        await applyStoredRecording(row, stored);
      }

    }

    catch (e) {
      return;   // keine Datenbank verfügbar
    }

  }

}


async function clearRecordings() {

  for (let row = 0; row < ROWS; row++) {

    try {
      await dbRequest("readwrite", function (store) {
        store.delete(recordingKey(row));
        return null;
      });
    }
    catch (e) {}

  }

  recordedRows.clear();

  SOUNDS.forEach(function (entry, row) {
    buffers[row] = null;
    if (entry.klang) {
      loadSound(entry.klang, row);
    }
  });

  showMessage("Aufnahmen gelöscht – die Original-Klänge sind zurück.");

}


/* ---------- Aufnahme-Modus ---------- */

async function enterRecordMode() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia ||
    !window.MediaRecorder
  ) {
    showMessage("Aufnehmen geht in diesem Browser leider nicht.");
    return;
  }

  try {

    /* Ohne Filter: wichtig für Kontaktmikrofone */

    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

  }

  catch (e) {
    showMessage("Kein Zugriff aufs Mikrofon.");
    return;
  }

  await resumeAudio();

  stopPlayback();

  recordMode = true;

  micButton.classList.add("active");
  app.classList.add("record-mode");

  showMessage("Zeichen gedrückt halten und Geräusch machen.");

}


function leaveRecordMode() {

  stopRecording();

  if (micStream) {
    micStream.getTracks().forEach(function (track) {
      track.stop();
    });
  }

  micStream = null;
  recordMode = false;

  micButton.classList.remove("active");
  app.classList.remove("record-mode");

}


function startRecordingFor(row, item) {

  if (!micStream || recorder) {
    return;
  }

  recordChunks = [];
  recordItem = item;

  try {
    recorder = new MediaRecorder(micStream);
  }
  catch (e) {
    showMessage("Aufnahme konnte nicht starten.");
    return;
  }

  recorder.ondataavailable = function (event) {
    if (event.data && event.data.size > 0) {
      recordChunks.push(event.data);
    }
  };

  recorder.onstop = function () {
    finishRecording(row);
  };

  recorder.start();

  item.classList.add("recording");

  clearTimeout(recordTimer);
  recordTimer = setTimeout(stopRecording, MAX_RECORDING_MS);

}


function stopRecording() {

  clearTimeout(recordTimer);

  if (recorder && recorder.state === "recording") {
    recorder.stop();
  }

}


async function finishRecording(row) {

  const type = recorder ? recorder.mimeType : "";

  recorder = null;

  if (recordItem) {
    recordItem.classList.remove("recording");
    recordItem = null;
  }

  const blob = new Blob(recordChunks, { type: type || "audio/webm" });

  recordChunks = [];

  if (blob.size < 800) {
    showMessage("Etwas länger gedrückt halten.");
    return;
  }

  let processed = null;
  let data = null;

  try {
    data = await blob.arrayBuffer();
    const raw = await audioContext.decodeAudioData(data.slice(0));
    processed = processRecording(raw);
  }
  catch (e) {
    console.error(e);
    showMessage("Aufnahme konnte nicht gelesen werden.");
    return;
  }

  if (!processed) {
    showMessage("Nichts zu hören – noch mal!");
    return;
  }

  recordedRows.add(row);
  buffers[row] = processed;


  /* auf dem Gerät merken */

  try {
    await dbRequest("readwrite", function (store) {
      return store.put({ type: blob.type, data: data }, recordingKey(row));
    });
  }
  catch (e) {}


  /* gleich anhören */

  playSound(row, 0.6, rateFromPitch(currentPitch), 0);

  showMessage("Aufgenommen!");

}


if (RECORDING_ENABLED) {

  micButton.addEventListener("click", function () {

    if (recordMode) {
      leaveRecordMode();
    }
    else {
      enterRecordMode();
    }

  });

  loadStoredRecordings();

}


/* =========================================================
   VOLLBILD
   Blendet Browser- und Systemleisten aus (Android, Laptop).
   Auf iPhones erlaubt Safari das nicht – dort bleibt der
   Knopf unsichtbar.
   ========================================================= */

function fullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}


async function enterFullscreen() {

  const el = document.documentElement;

  try {

    if (el.requestFullscreen) {
      await el.requestFullscreen({ navigationUI: "hide" });
    }
    else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }

  }

  catch (e) {
    showMessage("Vollbild geht hier leider nicht.");
    return;
  }


  /* Handy: im Vollbild aufs Querformat festlegen (wenn möglich) */

  try {
    if (screen.orientation && screen.orientation.lock && matchMedia("(pointer: coarse)").matches) {
      await screen.orientation.lock("landscape");
    }
  }
  catch (e) {}

}


function exitFullscreen() {

  try {

    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
    else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }

  }

  catch (e) {}

}


function updateFullscreenButton() {

  if (!fullscreenButton) {
    return;
  }

  const full = !!fullscreenElement();

  fullscreenButton.classList.toggle("is-full", full);
  fullscreenButton.setAttribute("aria-label", full ? "Vollbild beenden" : "Vollbild");
  fullscreenButton.title = full ? "Vollbild beenden" : "Vollbild";

}


if (fullscreenButton) {

  const supported =
    document.fullscreenEnabled ||
    document.webkitFullscreenEnabled;

  if (supported) {

    fullscreenButton.hidden = false;

    fullscreenButton.addEventListener("click", function () {

      if (fullscreenElement()) {
        exitFullscreen();
      }
      else {
        enterFullscreen();
      }

    });

    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);

  }

}


/* =========================================================
   TEMPO – senkrechter Regler (Handy quer)
   oben = schnell, unten = langsam
   ========================================================= */

const TEMPO_MIN = Number(tempoSlider.min) || 50;
const TEMPO_MAX = Number(tempoSlider.max) || 160;

function updateTempoVertical() {

  /* bewusst ohne TEMPO_MIN/MAX: wird schon beim Start aufgerufen */

  const min = Number(tempoSlider.min) || 50;
  const max = Number(tempoSlider.max) || 160;

  if (tempoSliderV) {
    const t = (bpm - min) / (max - min);
    tempoSliderV.style.setProperty("--tv", (1 - t) * 100);
    tempoSliderV.setAttribute("aria-valuenow", bpm);
  }

  if (tempoNumber) {
    tempoNumber.textContent = bpm;
  }

}


function setTempo(value) {

  bpm = Math.round(Math.max(TEMPO_MIN, Math.min(TEMPO_MAX, value)));

  tempoSlider.value = bpm;

  showTempo();

}


if (tempoSliderV) {

  let tempoPointer = null;

  const tempoFromEvent = function (event) {
    const r = tempoSliderV.getBoundingClientRect();
    const t = 1 - (event.clientY - r.top) / r.height;
    return TEMPO_MIN + t * (TEMPO_MAX - TEMPO_MIN);
  };

  tempoSliderV.addEventListener("pointerdown", function (event) {
    event.preventDefault();
    tempoPointer = event.pointerId;
    try { tempoSliderV.setPointerCapture(event.pointerId); } catch (e) {}
    setTempo(tempoFromEvent(event));
  });

  tempoSliderV.addEventListener("pointermove", function (event) {
    if (event.pointerId === tempoPointer) {
      setTempo(tempoFromEvent(event));
    }
  });

  const endTempo = function (event) {
    if (event.pointerId === tempoPointer) {
      tempoPointer = null;
      try { tempoSliderV.releasePointerCapture(event.pointerId); } catch (e) {}
    }
  };

  tempoSliderV.addEventListener("pointerup", endTempo);
  tempoSliderV.addEventListener("pointercancel", endTempo);

  tempoSliderV.addEventListener("keydown", function (event) {
    if (event.key === "ArrowUp") { setTempo(bpm + 5); event.preventDefault(); }
    if (event.key === "ArrowDown") { setTempo(bpm - 5); event.preventDefault(); }
  });

}

updateTempoVertical();


/* =========================================================
   TITEL – über das T in der Werkzeugleiste eingeben,
   steht dann klein oben rechts auf der Partitur
   ========================================================= */

function updateTitleDisplay() {

  if (titleDisplay && scoreTitle) {
    titleDisplay.textContent = scoreTitle.value.trim();
  }

}


function openTitleDialog() {

  if (!titleDialog || !scoreTitle) {
    return;
  }

  titleDialog.hidden = false;

  scoreTitle.focus();
  scoreTitle.select();

}


function closeTitleDialog() {

  if (!titleDialog) {
    return;
  }

  titleDialog.hidden = true;

  if (scoreTitle) {
    scoreTitle.blur();
  }

  updateTitleDisplay();

}


if (titleButton) {
  titleButton.addEventListener("click", openTitleDialog);
}

if (titleOk) {
  titleOk.addEventListener("click", closeTitleDialog);
}

if (scoreTitle) {
  scoreTitle.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === "Escape") {
      event.preventDefault();
      closeTitleDialog();
    }
  });
}

if (titleDialog) {
  titleDialog.addEventListener("pointerdown", function (event) {
    if (event.target === titleDialog) {
      closeTitleDialog();
    }
  });
}

updateTitleDisplay();

landscape.addEventListener("contextmenu", function (event) {

});
